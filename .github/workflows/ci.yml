name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  engine-test:
    name: 引擎单测（纯 JVM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 包装器要下一百多 MB 的发行版，缓存一下
      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 引擎模块是**纯 JVM**（刻意不依赖 Android SDK），所以这里不用装 SDK，
      # 也不需要跑 :app —— 只跑引擎的 240 条单测，一分多钟。
      #
      # 有几条测试要读 D:/tmp/ime-analysis/ 下的评估集文件，
      # 那些文件不在仓库里 → 用 assumeTrue 跳过，不会误报失败。
      - name: 跑引擎单测
        working-directory: android
        run: ./gradlew :engine:test --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: android/engine/build/reports/tests/test/
          retention-days: 7
